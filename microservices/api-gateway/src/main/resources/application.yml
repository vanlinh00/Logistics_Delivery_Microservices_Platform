server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Keycloak OIDC Provider Reverse Proxy Route
        - id: keycloak-iam
          uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}
          predicates:
            - Path=/realms/**,/resources/**,/js/**,/auth/**
        # Microservice Business Routes
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - TokenRelay=
        - id: pickup-fleet-service
          uri: lb://pickup-fleet-service
          predicates:
            - Path=/api/v1/fleet/**
          filters:
            - TokenRelay=
        - id: fulfillment-service
          uri: lb://fulfillment-service
          predicates:
            - Path=/api/v1/fulfillment/**
          filters:
            - TokenRelay=
        - id: tracking-service
          uri: lb://tracking-service
          predicates:
            - Path=/api/v1/tracking/**
          filters:
            - TokenRelay=
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
        - id: user-auth-service
          uri: lb://user-auth-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /login/oauth2/code/**, /oauth2/authorization/**
        - id: keycloak-oidc-proxy
          uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}
          predicates:
            - Path=/realms/**, /resources/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
