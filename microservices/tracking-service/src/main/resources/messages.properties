# Standard Success and Info Messages
i.xx.fw.200=Operation completed successfully.
i.xx.fw.201=Resource created successfully.

# Client Errors
i.xx.fw.400=Bad Request. Please verify your submitted data.
i.xx.fw.401=Unauthorized. Authentication is required.
i.xx.fw.403=Forbidden. You do not have permission to perform this action.
i.xx.fw.404=Resource not found.
i.xx.fw.405.tracking=Tracking event or history not found for tracking number: {0}.
i.xx.fw.405.parcel=Parcel document not found in Elasticsearch for tracking number: {0}.
i.xx.fw.409=Resource conflict occurred.
i.xx.fw.410=Invalid or blacklisted authorization token.
i.xx.fw.411=Validation failed on one or more request fields.
i.xx.fw.412=Constraint violation error occurred.
i.xx.fw.413=Business rule validation failed.

# Server Errors
i.xx.fw.500=Internal server error occurred in Tracking Service. Please contact support.
