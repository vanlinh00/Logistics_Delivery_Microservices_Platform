# Standard Message Codes for Tracking Service
i.xx.fw.200=Operation completed successfully
i.xx.fw.201=Resource created successfully
i.xx.fw.400=Invalid request parameters
i.xx.fw.401=Unauthorized access
i.xx.fw.403=Access forbidden
i.xx.fw.404=Requested tracking resource not found
i.xx.fw.405.tracking=Tracking number not found
i.xx.fw.405.parcel=Parcel not found in search index
i.xx.fw.409=Resource state conflict
i.xx.fw.410=Authentication token is invalid or blacklisted
i.xx.fw.411=Validation failed for request payload
i.xx.fw.412=Constraint violation error
i.xx.fw.413=Business rule violation
i.xx.fw.500=An unexpected internal server error occurred in Tracking Service
