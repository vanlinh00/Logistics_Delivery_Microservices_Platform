apiVersion: v1
kind: Namespace
metadata:
  name: logistics-prod
  labels:
    name: logistics-prod
    environment: production
    app.kubernetes.io/part-of: logistics-microservices
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: logistics-prod
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    pods: "50"
    services: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: logistics-prod
spec:
  limits:
    - default:
        cpu: 1000m
        memory: 1024Mi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      type: Container
