apiVersion: v1
kind: ServiceAccount
metadata:
  name: logistics-service-account
  namespace: logistics-prod
  labels:
    app.kubernetes.io/name: logistics-service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: logistics-prod
  name: logistics-pod-reader
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: logistics-pod-reader-binding
  namespace: logistics-prod
subjects:
- kind: ServiceAccount
  name: logistics-service-account
  namespace: logistics-prod
roleRef:
  kind: Role
  name: logistics-pod-reader
  apiGroup: rbac.authorization.k8s.io
